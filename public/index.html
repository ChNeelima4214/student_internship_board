<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Board</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b68;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input, select {
      flex: 1;
      min-width: 180px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
      min-width: 0;
    }

    .card h2 {
      color: #173b68;
      font-size: 20px;
    }

    .card button {
      background: #173b68;
      color: white;
      cursor: pointer;
      margin: 10px 5px 0 0;
    }

    button:focus, input:focus, select:focus {
      outline: 3px solid #f2b544;
      outline-offset: 2px;
    }

    #message { margin: 15px 0; }

    @media (max-width: 400px) {
      main { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      input, select { min-width: 0; width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Student Internship Board</h1>
    <p>Find an internship that matches your skills.</p>
  </header>

  <main>
    <section aria-label="Internship filters">
      <div class="filters">
        <input id="search" type="search"
          placeholder="Search internships"
          aria-label="Search internships">

        <select id="domain" aria-label="Filter by domain">
          <option value="">All domains</option>
          <option value="Full Stack Development">Full Stack Development</option>
          <option value="UI/UX">UI/UX</option>
          <option value="Data Analytics">Data Analytics</option>
          <option value="Cyber Security">Cyber Security</option>
        </select>

        <select id="mode" aria-label="Filter by work mode">
          <option value="">All work modes</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-site">On-site</option>
        </select>
      </div>
    </section>

    <p id="message" role="status" aria-live="polite">
      Loading internships...
    </p>

    <section id="internshipList" class="grid"
      aria-label="Available internships"></section>

    <button id="retry" type="button" hidden>
      Retry loading
    </button>
  </main>

  <script>
    const list = document.getElementById("internshipList");
    const message = document.getElementById("message");
    const search = document.getElementById("search");
    const domain = document.getElementById("domain");
    const mode = document.getElementById("mode");
    const retry = document.getElementById("retry");

    let internships = [];

    async function loadInternships() {
      message.textContent = "Loading internships...";
      retry.hidden = true;

      try {
        const response = await fetch("/api/internships");

        if (!response.ok) {
          throw new Error("Could not load internships");
        }

        const result = await response.json();
        internships = result.data;
        renderInternships();
      } catch (error) {
        list.replaceChildren();
        message.textContent =
          "Unable to load internships. Please try again.";
        retry.hidden = false;
      }
    }

    function renderInternships() {
      const query = search.value.trim().toLowerCase();

      const filtered = internships.filter((item) => {
        const text =
          `${item.title} ${item.domain} ${item.location} ${item.skills.join(" ")}`
            .toLowerCase();

        return text.includes(query) &&
          (!domain.value || item.domain === domain.value) &&
          (!mode.value || item.mode === mode.value);
      });

      list.replaceChildren();

      if (filtered.length === 0) {
        message.textContent = "No internships match your search.";
        return;
      }

      message.textContent = `${filtered.length} internship(s) found.`;

      filtered.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = item.title;

        const details = document.createElement("p");
        details.textContent =
          `${item.domain} | ${item.mode} | ${item.location}`;

        const skills = document.createElement("p");
        skills.textContent = `Skills: ${item.skills.join(", ")}`;

        const openings = document.createElement("p");
        openings.textContent = `Openings: ${item.openings}`;

        const viewButton = document.createElement("button");
        viewButton.type = "button";
        viewButton.textContent = "View details";

        viewButton.addEventListener("click", async () => {
          try {
            const response = await fetch(
              `/api/internships/${encodeURIComponent(item.id)}`
            );
            const result = await response.json();

            if (!response.ok) {
              alert(result.data?.message || "Unable to load details.");
              return;
            }

            const internship = result.data;
            alert(
              `${internship.title}\n` +
              `Domain: ${internship.domain}\n` +
              `Mode: ${internship.mode}\n` +
              `Location: ${internship.location}\n` +
              `Skills: ${internship.skills.join(", ")}\n` +
              `Openings: ${internship.openings}`
            );
          } catch (error) {
            alert("Could not connect to the server.");
          }
        });

        const applyButton = document.createElement("button");
        applyButton.type = "button";
        applyButton.textContent = "Apply Now";

        applyButton.addEventListener("click", async () => {
          const name = prompt("Enter your full name:");

          if (!name || !name.trim()) {
            alert("Please enter your name.");
            return;
          }

          const email = prompt("Enter your email address:");
          const cleanEmail = email ? email.trim() : "";

          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
            alert("Please enter a valid email address.");
            return;
          }

          applyButton.disabled = true;
          applyButton.textContent = "Submitting...";

          try {
            const response = await fetch("/api/applications", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                internshipId: item.id,
                name: name.trim(),
                email: cleanEmail
              })
            });

            const result = await response.json();

            if (!response.ok) {
              alert(
                result.data?.message ||
                "Application failed. Please try again."
              );
              return;
            }

            alert("Application submitted successfully!");
          } catch (error) {
            alert("Could not connect to the server. Please try again.");
          } finally {
            applyButton.disabled = false;
            applyButton.textContent = "Apply Now";
          }
        });

        card.append(
          title,
          details,
          skills,
          openings,
          viewButton,
          applyButton
        );

        list.appendChild(card);
      });
    }

    search.addEventListener("input", renderInternships);
    domain.addEventListener("change", renderInternships);
    mode.addEventListener("change", renderInternships);
    retry.addEventListener("click", loadInternships);

    loadInternships();
  </script>
</body>
</html>
